name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install
        run: npm install

      - name: 🚀 Semantic Release
        id: semantic
        run: |
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          npx semantic-release
          new="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$new" ] && [ "$prev" != "$new" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$new" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔔 Trigger Feed
        if: steps.semantic.outputs.released == 'true'
        run: |
          gh api repos/Banten-IT-Solutions/BITS-WRT-Packages/dispatches \
            -f event_type=release-update \
            -f client_payload[repo]=BITS-Theme
        env:
          GH_TOKEN: ${{ secrets.FEED_PAT }}

  apk:
    name: 📦 Build apk
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ openwrt-24.10, openwrt-25.12 ]
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: 🏗️ Build apk
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-${{ matrix.branch }}
          FEEDNAME: bits
          PACKAGES: luci-theme-bits
          NO_REFRESH_CHECK: true

      - name: 📤 Attach apk
        run: |
          find bin -name '*.apk' -exec gh release upload "${{ needs.release.outputs.tag }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}